<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title>글 상세</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container">
        <h2>글 수정</h2>
        <form th:action="@{/boards/{bno}/edit(bno=${board.bno})}" method="post">
            <div class="mb-3">
                <label for="title" class="form-label">글제목</label>
                <input type="text" id="title" name="title" class="form-control" th:value="${board.title}" required>
            </div>
            <div class="mb-3">
                <label for="content" class="form-label">글내용</label>
                <textarea id="content" name="content" class="form-control" rows="10" th:text="${board.content}" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">글수정</button>
            <a th:href="@{/boards/{bno}(bno=${board.bno})}" class="btn btn-secondary">취소</a>
        </form>
    </div>
</div>
</body>
</html>

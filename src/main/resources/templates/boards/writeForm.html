<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title>글 등록</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container">
        <h2>글 등록</h2>
        <!--
        파일을 Controller로 전송하기 위해서는 <form> 태그에 두가지 속성을 필수로 추가
        1. method="post" : GET 방식은 파일 전송을 지원하지 않는다.
        2. enctype="multipart/form-data" : 폼 데이터가 여러 부분(multipart)으로 나뉘어 전송됨을 명시
                                           텍스트 데이터와 파일 데이터가 분리되어 서버로 전송.
        -->
        <form th:action="@{/boards/write}" method="post" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="title" class="form-label">글제목</label>
                <input type="text" id="title" name="title" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="content" class="form-label">글내용</label>
                <textarea id="content" name="content" class="form-control" rows="10" required></textarea>
            </div>

            <!-- 파일 첨부를 위한 <input> 태그 -->
            <div class="mb-3">
                <label for="file" class="form-label">파일 첨부</label>
                <input type="file" id="file" name="file" class="form-control">
            </div>

            <button type="submit" class="btn btn-primary">글등록</button>
            <a th:href="@{/boards}" class="btn btn-secondary">취소</a>
        </form>
    </div>
</div>
</body>
</html>
